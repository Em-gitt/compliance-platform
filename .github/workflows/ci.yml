name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: compliance
          POSTGRES_USER: compliance_app
          POSTGRES_PASSWORD: compliance_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compliance_app -d compliance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, pgsql, pdo_sqlite, sqlite3, bcmath, sodium
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan documents:generate-key
      - name: Run PostgreSQL Migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: compliance
          DB_USERNAME: compliance_app
          DB_PASSWORD: compliance_ci
      - run: vendor/bin/pint --test
      - name: Run vendor/bin/pest
        run: |
          vendor/bin/pest --colors=never 2>&1 | tee pest.log || {
            echo "### Pest Failure" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 pest.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ai_test
          POSTGRES_USER: ai_test
          POSTGRES_PASSWORD: ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_test -d ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # CMP-29: chunk storage tests run against pgvector and must not be skipped in CI.
      TEST_DATABASE_URL: postgresql://ai_test:ai_test@127.0.0.1:5432/ai_test
      REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - name: Install OCR system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa tesseract-ocr-eng poppler-utils
      - run: pip install -r requirements.txt
      - run: ruff check .
      - name: Run pytest
        run: |
          pytest -vv 2>&1 | tee pytest.log || {
            echo "### Pytest Failure" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 pytest.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

  e2e:
    name: Playwright E2E Tests (CMP-45)
    runs-on: ubuntu-latest
    needs: [frontend, backend, ai-service]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, sqlite3, bcmath, sodium
          tools: composer:v2
      - name: Setup Backend for E2E
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate
          php artisan documents:generate-key
          sed -i 's/^SESSION_SECURE_COOKIE=true/SESSION_SECURE_COOKIE=false/' .env
          sed -i 's/^AI_SERVICE_URL=http:\/\/ai-service:8001/AI_SERVICE_URL=http:\/\/127.0.0.1:8001/' .env
          sed -i 's/^AUTH_RATE_LIMIT=.*/AUTH_RATE_LIMIT=100/' .env
          touch database/database.sqlite
          php artisan migrate --force
          php artisan db:seed
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - name: Install AI Service Dependencies
        working-directory: ai-service
        run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Root Dependencies
        run: npm ci
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E tests
        run: npx playwright test --project=chromium
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: docs/qa/playwright-report/
          retention-days: 30